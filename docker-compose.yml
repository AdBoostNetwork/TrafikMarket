name: traffmarket

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-traffmarket}
    volumes:
      - traffmarket_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-traffmarket}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.migrate
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/traffmarket?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.scheduler
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/traffmarket?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SCHEDULER_RUN_HOUR: ${SCHEDULER_RUN_HOUR:-3}
      TGSTAT_QUEUE: ${TGSTAT_QUEUE:-updater.tgstat}
      MAXDASH_QUEUE: ${MAXDASH_QUEUE:-updater.maxdash}
    volumes:
      - ./logs/scheduler:/app/backend/updater/scheduler/logs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing minio/avatars &&
      mc mb --ignore-existing minio/announcements &&
      mc mb --ignore-existing minio/wallpapers &&
      mc mb --ignore-existing minio/news &&
      mc anonymous set download minio/avatars &&
      mc anonymous set download minio/announcements &&
      mc anonymous set download minio/wallpapers &&
      mc anonymous set download minio/news &&
      mc mb --ignore-existing minio/requests &&
      mc anonymous set download minio/requests
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/traffmarket?sslmode=disable
      APP_HOST: 0.0.0.0
      APP_PORT: 8000

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_AVATARS: avatars
      MINIO_BUCKET_ANNOUNCEMENTS: announcements
      MINIO_BUCKET_WALLPAPERS: wallpapers
      MINIO_BUCKET_NEWS: news
      MINIO_BUCKET_REQUESTS: requests
    ports:
      - "8000:8000"
    volumes:
      - ./logs/app:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ai-assistant:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ai-assistant
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: 8001
      AI_DATABASE_URL: postgres://postgres:postgres@postgres:5432/traffmarket_ai?sslmode=disable
      MAIN_DATABASE_URL: postgres://postgres:postgres@postgres:5432/traffmarket?sslmode=disable

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_URL: https://openrouter.ai/api/v1
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "8001:8001"
    volumes:
      - ./logs/ai-assistant:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  traffmarket_data:
    name: traffmarket
  rabbitmq_data:
    name: traffmarket_rabbitmq
  minio_data:
    name: traffmarket_minio
